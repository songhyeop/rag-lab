AWSTemplateFormatVersion: '2010-09-09'
Description: RAG Lab immutable image and index storage
Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: rag-lab
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep untagged images for three days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":3},"action":{"type":"expire"}}]}'
  IndexBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
Outputs:
  IndexBucketName: {Value: !Ref IndexBucket}
  RepositoryUri: {Value: !GetAtt Repository.RepositoryUri}
