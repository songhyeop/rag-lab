[project]
name = "rag-lab"
version = "0.1.0"
description = "Reproducible retrieval and grounded answer experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3[crt]>=1.35,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mangum>=0.19,<1",
  "google-auth>=2.38,<3",
  "requests>=2.32,<3",
  "cachecontrol>=0.14,<1",
  "pydantic-settings>=2.8,<3",
  "numpy>=2,<3",
  "faiss-cpu>=1.10,<2",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<2",
  "rank-bm25>=0.2.2,<1",
  "llama-index-core>=0.12,<1",
  "tiktoken>=0.9,<1",
  "httpx>=0.28,<1",
]
[project.scripts]
rag = "rag_lab.cli:main"

[project.optional-dependencies]
data = [
    "pyarrow>=19,<25",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "moto[dynamodb]>=5,<6", "types-requests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src", "scripts"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
