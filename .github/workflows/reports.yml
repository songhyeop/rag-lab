name: Experiment contracts
on:
  pull_request:
    paths: ['src/rag_lab/evaluation.py', 'src/rag_lab/metrics.py', 'src/rag_lab/data.py', 'configs/**', 'tests/**', '.github/workflows/reports.yml']
permissions:
  contents: read
jobs:
  report-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: '0.13.6'}
      - run: uv sync --frozen
      - run: uv run pytest tests/test_data.py tests/test_retrieval.py tests/test_reports.py -q
